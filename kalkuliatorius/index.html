<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Pristatymas">
<link rel="apple-touch-icon" href="../table/apple-touch-icon.png">
<title>Croupier Pro Table — pristatymas</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0d0c0a; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { position: fixed; top: 0; right: 0; bottom: 0; left: 0; }
  #stage { position: absolute; top: 0; right: 0; bottom: 0; left: 0;
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center; }
  #stage img { max-width: 100%; max-height: 100%; display: block; -webkit-transition: opacity .25s; transition: opacity .25s; }
  #num { position: absolute; right: 14px; bottom: 10px; font: 14px/1 -apple-system, Roboto, Arial, sans-serif;
    color: rgba(217,180,90,.55); }
  #hint { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center;
    font: 15px/1.4 -apple-system, Roboto, Arial, sans-serif; color: rgba(239,232,214,.7);
    -webkit-transition: opacity .6s; transition: opacity .6s; pointer-events: none; }
</style>
</head>
<body>
<div id="stage"><img id="slide" alt=""></div>
<div id="num"></div>
<div id="hint">Braukite arba palieskite dešinėje – kita skaidrė, kairėje – ankstesnė</div>
<script>
(function () {
  var N = 11, i = 0, V = "?v=3";
  var img = document.getElementById('slide'), num = document.getElementById('num'), hint = document.getElementById('hint');
  function src(k) { return "s-" + (k < 9 ? "0" : "") + (k + 1) + ".jpg" + V; }
  // заранее загружаем все слайды, чтобы листалось без задержки
  for (var k = 0; k < N; k++) { var p = new Image(); p.src = src(k); }
  function show(k) {
    if (k < 0 || k >= N) return;
    i = k; img.src = src(i); num.textContent = (i + 1) + ' / ' + N;
    try { location.replace('#' + (i + 1)); } catch (e) {}
  }
  function next() { show(i + 1); }
  function prev() { show(i - 1); }
  var h = parseInt((location.hash || '').replace('#', ''), 10);
  show(h > 0 && h <= N ? h - 1 : 0);
  setTimeout(function () { hint.style.opacity = '0'; }, 3500);

  var sx = 0, sy = 0, moved = false;
  document.addEventListener('touchstart', function (e) {
    var t = e.touches[0]; sx = t.clientX; sy = t.clientY; moved = false;
  }, false);
  document.addEventListener('touchmove', function (e) { e.preventDefault(); moved = true; }, { passive: false });
  document.addEventListener('touchend', function (e) {
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { if (dx < 0) next(); else prev(); }
    else if (Math.abs(dx) < 10 && Math.abs(dy) < 10) { if (t.clientX > window.innerWidth / 3) next(); else prev(); }
    e.preventDefault();
  }, false);
  document.addEventListener('click', function (e) {
    if (e.clientX > window.innerWidth / 3) next(); else prev();
  }, false);
  document.addEventListener('keydown', function (e) {
    var c = e.keyCode;
    if (c === 39 || c === 34 || c === 32) next();
    else if (c === 37 || c === 33) prev();
  }, false);
})();
</script>
</body>
</html>
