<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0c0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Croupier Table">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; font: 14px -apple-system, BlinkMacSystemFont, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Croupier Pro Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@700&family=Roboto+Condensed:wght@500;700&family=Roboto:wght@400;500;700&display=swap">
<style>
/* v78 (29.10): окно Number — общая рамка поля, 0 на всю ширину.
   v77 (29.10): без прокрутки страницы на телефоне (экран прибит, с высоты 460 px).
   v76 (28.10): перебор крупным жетоном — играющий кусок как жетоны, которыми он набирается (500 на сплите, Max 100 → 34×100, сдача 300).
   v75 (28.10): жетон с комплитом — цифры как у всех, плашка прикрывает; строка CHIPS не обрезается справа; кусок перебора платится жетонами места (без «+25 cash»).
   v74 (28.10): номинал на жетоне крупнее («1000» без пробела, сжимается по ширине); жетоны 500 и 1000 в «× N» (2 ряда по 4).
   v73 (28.10): жетон на поле как настоящий (белые вставки по краю, кольцо, блеск).
   v72 (28.10): разбор «?» влезает в рамку по ширине (перенос строк, числа не рвутся).
   v71 (28.10): в разборе сдача с комплита по поставленной сумме расписана: «pastatyta 5 000 − 40 × 100 (4 000)».
   v70 (28.10): окна «Настройки» и «Выбор числа» закрываются только кнопкой Close.
   v69 (28.10): при включении пусто (без примера).
   v68 (28.10): комплиты по всему полю — долгое нажатие на число в окне выбора; сдача со всех пересечений — в табло.
   Layout (версия 35, 27.10): две вкладки QUICK | FIELD. В FIELD поле занимает всё свободное место, клавиатуры нет — она во всплывающем окне.
   Номинал цветного жетона, Max, язык и логотип — в настройках (касание логотипа). Узкая колонка до 420 px; низкое широкое окно — две колонки. */
:root {
  --bg: #0d0c0a;
  --panel: #17140f;
  --panel-hi: #2a2214;
  --line: #3a3122;
  --gold: #d9b45a;
  --gold-hi: #f1d488;
  --on-gold: #1c1406;
  --fg: #efe8d6;
  --muted: #a39878;
  --red: #a3142a;
  --black: #121212;
  --green: #10884a;
  --warn: #ff8a6b;
  --btn: #d9b45a;          /* золотые кнопки */
  --res-top: #221b0e;      /* верх табло */
  --sep: rgba(217,180,90,.25);
  --chipbtn: #2a1a1e; --chipbtn-line: rgba(255,255,255,.45);
  --cash-fg: #ffffff;
  --dash: #4a3a22; --dash2: #2b2418;
  --cbtn: #1f2a1c; --disp: #0b0a08;
  --f-serif: "Noto Serif", Georgia, "Times New Roman", serif;
  --f-num: "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
/* v67: светлая тема (Nustatymai → Tema). Поле рулетки (красный, чёрный, зелёный, золото) — без изменений. */
html.light {
  --bg: #e9e4d8; --panel: #fbf8f1; --panel-hi: #efe6d2; --line: #cdbf9f;
  --gold: #a07a1c; --gold-hi: #84600e; --on-gold: #1c1406; --fg: #1f1a12; --muted: #6b604c; --warn: #c2410c;
  --btn: #d9b45a; --res-top: #f6eedb; --sep: rgba(160,122,28,.35);
  --chipbtn: #f4e6e2; --chipbtn-line: rgba(0,0,0,.35); --cash-fg: #15120c;
  --dash: #cdbf9f; --dash2: #e2d9c4; --cbtn: #eef2e8; --disp: #fffdf8;
  color-scheme: light;
}
html, body { background: var(--bg); color: var(--fg); }
body {
  font-family: var(--f-body);
  font-size: 14px;
  padding-left: max(10px, env(safe-area-inset-left, 0px));
  padding-right: max(10px, env(safe-area-inset-right, 0px));
  padding-block: 6px 8px;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, select { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: lining-nums tabular-nums; }

.app { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
/* v77: экран без прокрутки уже с высоты 460 px (раньше 600) — на телефоне в окне приложения калькулятор «ездил» вверх-вниз.
   Страница прибита к окну (position: fixed), прокрутки и «пружины» нет; прокручиваются только всплывающие окна. */
@media (min-height: 460px) {
  html, body { height: 100%; }
  html { overflow: hidden; overscroll-behavior: none; }
  body { overflow: hidden; position: fixed; inset: 0; margin: 0; overscroll-behavior: none;
    padding-top: max(6px, env(safe-area-inset-top, 0px)); padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); }
  .app { height: 100%; }
  .cpanel { flex: 1; min-height: 0; }
  .board-wrap { flex: 1; min-height: 0; display: flex; }
  .board-wrap svg { height: 100%; }
  /* v62: клавиши CALC — по 50 px, лишнее место отдаём табло. */
  /* v63: табло CALC — по содержимому (как в LAYOUT), остаток — строкам и клавишам. */
  .app.isq .result { flex: none; padding-block: 12px; }
  .app.isq .quick { flex: 1 1 0; min-height: min-content; }
  .app.isq .qrow { flex: 1 1 0; min-height: 40px; max-height: 66px; }
  .app.isq .keys { flex: 1.9 1 0; min-height: 0; grid-auto-rows: minmax(44px, 1fr); }
  .app.isq .keys button { height: auto; }
  /* v56: поле на всю ширину, высота — по ширине (задаёт fitCells); всё остальное место — табло. */
  .app:not(.isq) .cpanel { flex: 0 0 auto; }
  .app:not(.isq) .result { flex: 1 1 auto; min-height: 0; align-content: start; overflow: hidden; }
}
/* Низкое широкое окно: слева поле (или строки QUICK), справа шапка, ответ, кнопки. */
@media (min-width: 600px) and (max-height: 459px) {
  html, body { height: 100%; }
  body { overflow: hidden; }
  .app { max-width: 900px; height: 100%; display: grid; gap: 6px 10px;
    grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
    grid-template-rows: auto auto 1fr auto;
    grid-template-areas: "board top" "board result" "board keys" "board bottom"; }
  .top { grid-area: top; } .result { grid-area: result; } .keys { grid-area: keys; min-height: 0; } .bottom { grid-area: bottom; }
  .cpanel, .quick { grid-area: board; min-height: 0; }
  .app:not(.isq) .cpanel { flex: 1; } .app:not(.isq) .result { flex: none; align-content: start; }
  .board-wrap { flex: 1; min-height: 0; display: flex; } .board-wrap svg { height: 100%; }
  .app.isq .keys { grid-auto-rows: minmax(36px, 1fr); }
  .app.isq .keys button { height: auto; }
}

/* ---------- Шапка: логотип (= настройки) · Number · вкладки ---------- */
.top { display: flex; gap: 6px; align-items: stretch; height: 46px; }
.logo { position: relative; flex: 0 0 auto; width: 64px; padding: 2px; border-radius: 8px; border: 1px solid var(--line); background: #0f1d4a; display: grid; place-items: center; overflow: hidden; }
.logo-txt { font-family: var(--f-serif); font-size: 11.5px; line-height: 1.05; font-weight: 700; color: var(--gold); text-align: center; }
.logo img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.logo .gear { position: absolute; right: 2px; bottom: 1px; font-size: 11px; line-height: 1; color: var(--gold-hi); opacity: .85; }
.win { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 62px; padding: 0 2px; border-radius: 8px; border: 1px solid var(--gold); background: var(--panel); }
.win .l { font-size: 8.5px; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); font-weight: 700; line-height: 1; }
.win .v { font-size: 25px; font-weight: 700; color: var(--gold-hi); line-height: 1; }
.app.isq .win { display: none; }
.seg { flex: 1; display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { flex: 1; background: transparent; border: 0; font-weight: 700; font-size: 15px; letter-spacing: .5px; color: var(--muted); text-transform: uppercase; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--btn); color: var(--on-gold); }

/* ---------- Поле ---------- */
.cpanel { display: flex; flex-direction: column; }
.board-wrap { background: transparent; }
.board-wrap svg { overflow: visible; display: block; width: 100%; max-width: 100%; user-select: none; -webkit-user-select: none; touch-action: manipulation; -webkit-touch-callout: none; }

/* ---------- QUICK ---------- */
.app.isq .top { order: -2; }
.app.isq .result { order: -1; }
.quick { display: flex; flex-direction: column; gap: 4px; }
.qrow { display: flex; align-items: center; gap: 10px; min-height: 49px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); text-align: left; }
.qrow[aria-pressed="true"] { background: var(--panel-hi); border: 2px solid var(--gold-hi); }
.qrow .nm { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; }
.qrow .nm b { font-size: 17px; }
.qrow .nm span { font-size: 13px; color: var(--muted); }
.qrow .cnt { font-size: 28px; font-weight: 700; color: var(--gold-hi); min-width: 60px; text-align: right; }
.qrow .sum { font-size: 16px; font-weight: 700; min-width: 64px; text-align: right; }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
.keys button { height: 52px; font-size: 26px; font-weight: 700; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; font-family: var(--f-num); }
.keys button:active { background: var(--panel-hi); }
.keys .fn { font-size: 16px; color: var(--muted); font-family: var(--f-body); }


/* ---------- Ответ ---------- */
.result { position: relative; background: linear-gradient(180deg, var(--res-top), var(--panel)); border: 1px solid var(--gold); border-radius: 10px; padding: 18px 12px 18px; display: grid; gap: 8px; }
.bd-btn { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--muted); font: 700 14px var(--f-body); padding: 0; }
.result .cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; }
/* v75: табло не шире рамки — иначе строка CHIPS обрезалась справа, а уменьшение шрифта не срабатывало. */
.result { grid-template-columns: minmax(0, 1fr); }
/* Chips и Cash — две строки на всю ширину: слева подпись, справа крупное число. */
.result .cell { min-width: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; column-gap: 10px; }
.result .cell .big { text-align: right; }
.result .cell .rest { grid-column: 2; text-align: right; margin-top: -4px; }
.result .cash { border-top: 1px solid var(--sep); }
/* v63: табло CALC такое же, как в LAYOUT (две строки, подпись слева, крупное число справа).
   На невысоком экране (< 720 px) — компактно, Chips и Cash рядом, чтобы влезли строки и клавиши. */
@media (max-height: 719px) {
  .app.isq .result { padding: 8px 12px; }
  .app.isq .result .cols { grid-template-columns: 1fr 1fr; column-gap: 12px; }
  .app.isq .result .cell { grid-template-columns: minmax(0, 1fr); }
  .app.isq .result .head { flex-direction: row; align-items: center; }
  .app.isq .result .cell .big { text-align: left; }
  .app.isq .result .cell .rest { grid-column: 1; text-align: left; }
  .app.isq .result .cash { border-top: 0; border-left: 1px solid var(--sep); padding-left: 12px; }
}
.app.isq .qrow { min-height: 44px; }
.result .head { display: flex; align-items: center; gap: 6px; min-height: 22px; }
/* FIELD: «× N» под Chips и «?» под Cash — узкая левая колонка, числам больше места. */
.result .head { flex-direction: column; align-items: flex-start; gap: 8px; }
.result .label { font-size: 14px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--gold); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.valbtn { flex: 0 0 auto; height: 26px; padding: 0 10px; border-radius: 13px; border: 1px dashed var(--chipbtn-line); background: var(--chipbtn); color: var(--fg); font: 700 15px var(--f-num); }
.result .big { font-size: 76px; font-weight: 700; line-height: 1.05; color: var(--gold-hi); white-space: nowrap; overflow: hidden; }
.result .cash .big { color: var(--cash-fg); }
.result .rest { font-size: 14px; color: var(--muted); font-weight: 500; }
.result .rest .rv { font: 700 24px var(--f-num); color: var(--cash-fg); }
.result .rest .rl { font: 700 10px var(--f-body); letter-spacing: .8px; text-transform: uppercase; color: var(--muted); margin-left: 4px; }
.result .big .dn { font-size: .42em; color: var(--muted); margin-left: .08em; }
.result .big .pl { font-size: .5em; color: var(--muted); margin: 0 .18em; }
/* Две строки: жетоны комплита и жетоны поля, слева маленькая подпись. */
/* Одна строка: «392×25 + 103×25 + 32×10», под каждой частью мелкая подпись (комплит / жетоны). */
#r-chips.parts { padding-bottom: 13px; }
/* v75: перенос строки CHIPS — только между частями, справа. */
#r-chips .grp { white-space: nowrap; }
#r-chips.wrap { white-space: normal; line-height: 1.08; }
#r-chips.wrap > .pl { display: none; }
#r-chips.wrap .cseg { display: block; text-align: right; }
#r-chips.wrap .cseg.comp + .pl + .cseg, #r-chips.wrap .cseg.comp ~ .cseg { margin-top: 15px; }
#r-chips.wrap .cseg.comp .cap { left: auto; right: 0; }
/* Строки табло не сжимаются по высоте (иначе обрезалась сдача) — если не влезает, fitResult уменьшает числа. */
.result .big, .result .change, .result .rest { min-height: min-content; }
.result .big .cseg { position: relative; display: inline-block; }
.result .big .cap { position: absolute; right: 0; top: 100%; margin-top: -3px; text-align: center; font: 700 10px var(--f-body); letter-spacing: .8px; text-transform: uppercase; color: var(--muted); white-space: nowrap; line-height: 1; }
.result .big .cseg.comp .cap { color: var(--gold); left: 0; text-align: center; }
/* Сдача — деньгами (жетоны разного номинала в одну цифру не переводим). */
#v-ch-chips, .result .change .sep { display: none; }
.result .change { display: flex; align-items: baseline; gap: 8px; border-top: 1px dashed var(--dash); padding-top: 3px; color: var(--warn); font-weight: 700; }
.result .change { white-space: nowrap; overflow: hidden; }
.result .change .label { color: inherit; flex: 1 0 auto; }
.result .change .v { font-size: 28px; line-height: 1.1; }
.result .change .sep { opacity: .5; }
/* FIELD: номинал жетона, который ставится касанием (как раньше — внутри табло). */
.denoms { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px; padding-top: 2px; }
.denoms button { height: 38px; padding: 0; border-radius: 19px; border: 1px dashed var(--chipbtn-line); background: var(--chipbtn); font: 700 17px var(--f-num); color: var(--fg); }
.denoms button[aria-pressed="true"] { background: var(--btn); color: var(--on-gold); border: 1px solid var(--gold-hi); }
.app.isq .denoms { display: none; }

.bottom { display: grid; grid-template-columns: 1fr 2fr; gap: 6px; }
.bottom button { height: 46px; border-radius: 8px; font-weight: 700; font-size: 14px; letter-spacing: .8px; text-transform: uppercase; }
.bottom .ghost { background: transparent; border: 1px solid var(--line); color: var(--fg); }
.bottom .ghost:disabled { opacity: .35; cursor: default; }
.bottom .new { border: 0; background: var(--btn); color: var(--on-gold); }

/* ---------- Окна ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.62); display: grid; place-items: center; z-index: 20; padding: 12px; }
.bd { width: min(400px, 100%); max-height: 88vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--gold); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.bd h2 { margin: 0; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold); }
.bd h3 { margin: 4px 0 0; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
.bd .close { width: 100%; height: 44px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-weight: 700; }
.bd ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 14px; }
.bd li { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--dash2); padding-bottom: 3px; }
.bd li .v { color: var(--gold-hi); font-weight: 700; white-space: nowrap; }
.bd li.tot { border-bottom: 0; font-weight: 700; }
/* v72: разбор всегда в ширину рамки, без прокрутки вбок. Длинный итог («15 150 = 128×100 (komplitas) + 94×25 (žet.)») переносится на вторую строку справа. */
.bd { grid-template-columns: minmax(0, 1fr); overflow-x: hidden; }
.bd li > span:first-child { min-width: 0; overflow-wrap: break-word; }
.bd li.tot { flex-wrap: wrap; column-gap: 10px; row-gap: 2px; }
.bd li.tot .v { white-space: normal; flex: 1 1 auto; text-align: right; min-width: 0; }
.bd li.ret .v { color: var(--warn); }
.bd .empty { color: var(--muted); font-size: 13px; }

/* Окно числа: комплит одной кнопкой, жетоны Straight up — плюс/минус. */
.nhead { display: flex; align-items: center; gap: 10px; }
.nbadge { flex: 0 0 auto; width: 52px; height: 44px; border-radius: 8px; border: 1px solid #b8923a; display: grid; place-items: center; color: #fff; font: 700 26px var(--f-serif); }
.nbadge.r { background: var(--red); } .nbadge.b { background: var(--black); } .nbadge.g { background: var(--green); }
.nhead .t { display: grid; gap: 2px; min-width: 0; }
.nhead .t b { font-size: 16px; }
.nhead .t span { font-size: 13px; color: var(--muted); }
.cgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.cgrid button { height: 60px; border-radius: 10px; border: 1px solid var(--gold); background: var(--cbtn); color: var(--gold-hi); font: 700 27px var(--f-num); }
.cgrid button small { display: block; font: 600 11px var(--f-body); color: var(--muted); }
.cgrid button[aria-pressed="true"] { background: var(--btn); color: var(--on-gold); }
.cgrid button[aria-pressed="true"] small { color: var(--on-gold); }
.cgrid button:disabled { opacity: .3; cursor: default; border-style: dashed; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.row2 button, .act { height: 46px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-hi); font-weight: 700; font-size: 14px; }
.row2 .warn { color: var(--warn); }
.row2.one { grid-template-columns: 1fr; }
#kp .row2:has(#kp-del[hidden]) { grid-template-columns: 1fr; }
.stepper { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 10px; }
.stepper .lab { flex: 1; font-weight: 700; }
.stepper button { width: 54px; height: 50px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-hi); font: 700 26px var(--f-num); }
.stepper .cnt { min-width: 52px; text-align: center; font: 700 30px var(--f-num); color: var(--gold-hi); background: transparent; border: 0; width: auto; }

/* Окно ввода суммы / количества. */

<script>
(() => {
  const TX = {
    en: { set: "Settings", val: "Chip value", maxPer: "Max per number", lang: "Language", theme: "Theme", dark: "Dark", light: "Light",
      logo: "Logo", logoNote: "Your casino logo is stored only on this device. Any picture: PNG, JPG.", logoLoad: "Load logo", logoDel: "Remove logo",

      win: "Skaičius", quick: "Calc", field: "Layout",
      chips: "Žetonai", cash: "Cash", change: "Grąža", rest: "cash",
      newp: "Nauja išmoka", bd: "Paaiškinimas", close: "Uždaryti", clr: "Ištrinti", undo: "Atšaukti", ok: "Gerai", remove: "Pašalinti",
      compBy: "Komplitas", compByL: "Komplitas po", byW: "po", removeC: "Pašalinti komplitą", givenAmt: "Pastatyta suma", chipsOn: "Žetonai", fieldS: "Žetonai",
      payS: "Išmoka (CASH)", retS: "Grąža (CASH)", none: "Laimėjusių statymų nėra", total: "IŠ VISO", compsS: "Komplitai",
      notWin: "nelaimėjo", compS: "Komplitas", chipsS: "žet.", maxS: "maks.",
      pkHint: "Paspausk — iškritęs skaičius · ilgai — komplitas", farT: "komplitai už lauko ribų", stations: "vietos", given: "pastatyta", min: "min.", line: "Six line", place: "išstatyti ant lauko (lieka)", house: "statymas — pasiima kazino" }
  };
  const MULT = { straightUp: 35, split: 17, street: 11, corner: 8, sixLine: 5 };
  const NAME = { straightUp: "Straight up", split: "Split", street: "Street", corner: "Corner", sixLine: "Sixline" };
  const ORDER = ["sixLine", "street", "corner", "split", "straightUp"];
  const ORDER_ZERO = ["corner", "street", "split", "straightUp"];
  const QUICK_ROWS = ["straightUp", "split", "street", "corner", "sixLine"];
  const DENOMS = [1, 2, 5, 10, 25, 100, 500, 1000];   // v74: + 500 и 1000, окошко «× N» — два ряда по 4        // цена цветного жетона — одна на всё (настройки)
  const COMP_DENOMS = [5, 10, 25, 100];         // комплиты в казино: по 5, 10, 25, 100
  const LIMITS = [50, 100, 200, 300, 500];      // макс на номер в этом казино
  const RED = new Set([1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36]);
  const BW = 276, CW = 92, PADL = 6, PADR = 6, PADY = 6;   // v56: поле на ту же ширину, что и остальные блоки
  let CH = 80, ZH = 80;   // высота клетки подстраивается под экран — поле занимает всё свободное место
  const HIT = 26;         // зона касания места (сплит, корнер, стрит, сикс-лайн)

  // ---------- Поле (как в Croupier Pro: RouletteMath, BoardGeometry) ----------
  const colRow = n => [Math.floor((n - 1) / 3), (n - 1) % 3];
  const key = (t, ns) => t + ":" + [...ns].sort((a, b) => a - b).join("-");
  const parseKey = k => { const [t, ns] = k.split(":"); return { type: t, nums: ns.split("-").map(Number) }; };
  function windowOf(n) {
    if (n <= 3) return { start: 0, rows: [0, 1], zero: true };
    const r = colRow(n)[0], s = Math.min(Math.max(r - 1, 0), 9);
    return { start: s, rows: [s, s + 1, s + 2], zero: false };
  }
  const visibleNums = w => (w.zero ? [0] : []).concat(...w.rows.map(r => [r * 3 + 1, r * 3 + 2, r * 3 + 3]));
  function pos(type, nums, w) {
    const zo = w.zero ? ZH : 0;
    const center = n => { const [r, c] = colRow(n); return [CW * c + CW / 2, zo + CH * (r - w.start) + CH / 2]; };
    if (type === "straightUp") return nums[0] === 0 ? [BW / 2, zo * 0.62] : center(nums[0]);
    if (nums.includes(0)) {
      if (type === "split") return [center(nums.find(n => n !== 0))[0], zo];
      if (type === "corner") return [0, zo];
      if (type === "street") return [nums.includes(1) ? CW : CW * 2, zo];
    }
    const pts = nums.map(center);
    const ax = pts.reduce((s, p) => s + p[0], 0) / pts.length, ay = pts.reduce((s, p) => s + p[1], 0) / pts.length;
    return (type === "street" || type === "sixLine") ? [0, ay] : [ax, ay];
  }
  function betsWith(n) {
    const out = [], add = (t, ns) => out.push({ type: t, nums: ns });
    add("straightUp", [n]);
    if (n === 0) {
      add("split", [0, 1]); add("split", [0, 2]); add("split", [0, 3]);
      add("street", [0, 1, 2]); add("street", [0, 2, 3]); add("corner", [0, 1, 2, 3]);
      return out;
    }
    const [row, col] = colRow(n), ok = x => x >= 1 && x <= 36;
    if (col > 0) add("split", [n - 1, n]);
    if (col < 2) add("split", [n, n + 1]);
    if (row > 0 && ok(n - 3)) add("split", [n - 3, n]);
    if (row < 11 && ok(n + 3)) add("split", [n, n + 3]);
    if (col <= 1 && row <= 10) add("corner", [n, n + 1, n + 3, n + 4]);
    if (col >= 1 && row <= 10) add("corner", [n - 1, n, n + 2, n + 3]);
    if (col <= 1 && row >= 1) add("corner", [n - 3, n - 2, n, n + 1]);
    if (col >= 1 && row >= 1) add("corner", [n - 4, n - 3, n - 1, n]);
    const f = row * 3 + 1;
    add("street", [f, f + 1, f + 2]);
    if (row > 0) { const g = (row - 1) * 3 + 1; add("sixLine", [g, g + 1, g + 2, g + 3, g + 4, g + 5]); }
    if (row < 11) add("sixLine", [f, f + 1, f + 2, f + 3, f + 4, f + 5]);
    if (n === 1) { add("split", [0, 1]); add("street", [0, 1, 2]); add("corner", [0, 1, 2, 3]); }
    if (n === 2) { add("split", [0, 2]); add("street", [0, 1, 2]); add("street", [0, 2, 3]); add("corner", [0, 1, 2, 3]); }
    if (n === 3) { add("split", [0, 3]); add("street", [0, 2, 3]); add("corner", [0, 1, 2, 3]); }
    return out;
  }
  const compChips = n => betsWith(n).reduce((s, b) => s + b.nums.length, 0);   // 40, 30, 27, 36, 17, 24, 18
  const numsText = (type, nums) => {
    const s = [...nums].sort((a, b) => a - b);
    return (s.length <= 2 || s.includes(0)) ? s.join("/") : s[0] + "/" + s[s.length - 1];
  };
  const suKey = n => key("straightUp", [n]);
  // Ставка на месте — список жетонов в порядке постановки, например [10, 25, 25]; сумма — деньги.
  const listAmt = l => (l || []).reduce((a, b) => a + b, 0);
  const betAmt = k => listAmt(st.bets[k]);
  const groupList = l => { const m = {}; (l || []).forEach(d => m[d] = (m[d] || 0) + 1); return Object.keys(m).map(Number).sort((a, b) => b - a).map(d => [d, m[d]]); };
  const listText = l => groupList(l).map(([d, c]) => `${c}×${fmt(d)}`).join(" + ");

  // ---------- Состояние ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem("cpt_" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("cpt_" + k, JSON.stringify(v)); } catch (e) {} }
  };
  const st = {
    lang: "en", val: 1, cd: 1, limit: 100, tab: "field",
    win: 17,
    bets: {},        // FIELD: выигравшее место → жетонов (цена жетона = st.val)
    comps: {},       // число → { u: по сколько (5/10/25/100), given: подано деньгами или null }
    quick: {},       // QUICK: вид ставки → жетонов
    qactive: "straightUp", qfresh: true,
    hist: [], example: true
  };
  function restorePrefs() {
    st.lang = store.get("lang", "en"); if (!TX[st.lang]) st.lang = "en";
    st.val = 1;   // 23.10 (заказчик): при открытии всегда «жетон по 1»
    st.limit = store.get("limit", 100); if (!LIMITS.includes(st.limit)) st.limit = 100;
    const t = store.get("tab", "field"); st.tab = t === "quick" ? "quick" : "field";
  }

  // Поле подстраивается под размер окна.
  let lastSize = "";
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(() => {
      const a = document.querySelector(".app"), s = $("bw").clientWidth + "x" + a.clientHeight + "x" + a.clientWidth;
      if (s !== lastSize) { lastSize = s; if (st.tab !== "quick") renderBoard(compute()); fitResult(); }
    });
    ro.observe($("bw")); ro.observe(document.querySelector(".app"));
  }

  $("quick").addEventListener("click", e => {
    const b = e.target.closest("[data-q]"); if (!b) return;
    st.qactive = b.dataset.q; st.qfresh = true; render();
  });

  // ---------- Выпавшее число ----------
  for (let n = 1; n <= 36; n++) {
    const b = document.createElement("button"); b.type = "button"; b.dataset.n = n; b.textContent = n;
    b.className = RED.has(n) ? "r" : "b"; $("pk-grid").appendChild(b);
  }
  // v68: на числах окна — выпавшее (обводка) и комплиты (золотая рамка + плашка «25»).
  function markPicker() {
    document.querySelectorAll("#pk-sheet [data-n]").forEach(b => {
      const n = Number(b.dataset.n), ci = compInfo(n);
      b.setAttribute("aria-pressed", String(n === st.win));
      b.classList.toggle("hasc", !!ci);
      let tag = b.querySelector(".pk-c");
      if (ci) { if (!tag) { tag = document.createElement("span"); tag.className = "pk-c"; b.appendChild(tag); } tag.textContent = ci.ok ? fmt(ci.u) : "?"; }
      else if (tag) tag.remove();
    });
  }
  function openPicker() {
    $("pk-title").textContent = T().win; $("pk-close").textContent = T().close; $("pk-hint").textContent = T().pkHint;
    markPicker();
    $("pk-sheet").hidden = false;
  }
  // Касание числа — выпавшее число, окно закрывается. Долгое нажатие — комплит на это число, окно остаётся открытым.
  let pkTimer = null, pkLong = false, pkStart = null;
  $("pk-sheet").addEventListener("pointerdown", e => {
    pkLong = false; const b = e.target.closest("[data-n]"); if (!b) return;
    pkStart = [e.clientX, e.clientY];
    pkTimer = setTimeout(() => { pkTimer = null; pkLong = true; openNumber(Number(b.dataset.n)); }, 480);
  });
  $("pk-sheet").addEventListener("pointermove", e => { if (pkTimer && pkStart && Math.hypot(e.clientX - pkStart[0], e.clientY - pkStart[1]) > 10) { clearTimeout(pkTimer); pkTimer = null; } });
  ["pointerup", "pointercancel", "pointerleave"].forEach(t => $("pk-sheet").addEventListener(t, () => { if (pkTimer) { clearTimeout(pkTimer); pkTimer = null; } }));
  $("pk-sheet").addEventListener("contextmenu", e => e.preventDefault());
  $("pk-sheet").addEventListener("click", e => {
    if (pkLong) { pkLong = false; return; }
    const b = e.target.closest("[data-n]");
    if (b) { snapshot(); setWin(Number(b.dataset.n)); $("pk-sheet").hidden = true; render(); return; }
    if (e.target === $("pk-close")) $("pk-sheet").hidden = true;   // v70: только кнопкой Close
  });
  $("b-win").addEventListener("click", openPicker);
  $("mode").addEventListener("click", e => {
    const b = e.target.closest("[data-m]"); if (!b) return;
    st.tab = b.dataset.m === "quick" ? "quick" : "field"; store.set("tab", st.tab);
    render();
  });
  $("b-undo").addEventListener("click", undo);
  $("b-new").addEventListener("click", () => { reset(); render(); if (st.tab === "field") openPicker(); });
  $("b-bd").addEventListener("click", () => { $("sheet").hidden = false; });
  $("sheet").addEventListener("click", e => { if (e.target === $("sheet")) $("sheet").hidden = true; });

  // ---------- Настройки: номинал жетона, Max, язык, логотип ----------
  DENOMS.forEach(d => { const b = document.createElement("button"); b.type = "button"; b.dataset.d = d; b.className = "num"; b.textContent = d; $("set-val").appendChild(b); });
  LIMITS.forEach(d => { const b = document.createElement("button"); b.type = "button"; b.dataset.d = d; b.className = "num"; b.textContent = fmt(d); $("set-max").appendChild(b); });
  function renderSettings() {
    const tx = T();
    $("t-set").textContent = tx.set; $("t-val").textContent = tx.val; $("t-max").textContent = tx.maxPer; $("t-lang").textContent = tx.lang;
    $("t-logo").textContent = tx.logo; $("t-logo-note").textContent = tx.logoNote; $("t-logo-load").textContent = tx.logoLoad;
    $("b-logo-del").textContent = tx.logoDel; $("b-set-close").textContent = tx.close; $("b-val-close").textContent = tx.close;
    document.querySelectorAll("#set-val [data-d]").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.d) === st.val)));
    document.querySelectorAll("#set-max [data-d]").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.d) === st.limit)));
    document.querySelectorAll("#set-lang [data-l]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === st.lang)));
    $("t-theme").textContent = tx.theme; $("th-dark").textContent = tx.dark; $("th-light").textContent = tx.light;
    const lightOn = document.documentElement.classList.contains("light");
    $("th-dark").setAttribute("aria-pressed", String(!lightOn)); $("th-light").setAttribute("aria-pressed", String(lightOn));
    showLogo();
  }
  const openSettings = () => { renderSettings(); $("set-sheet").hidden = false; };
  $("b-logo").addEventListener("click", openSettings);
  $("b-val").addEventListener("click", () => { renderSettings(); $("val-sheet").hidden = false; });
  $("b-val-close").addEventListener("click", () => { $("val-sheet").hidden = true; });
  $("val-sheet").addEventListener("click", e => { if (e.target === $("val-sheet")) $("val-sheet").hidden = true; });
  $("b-set-close").addEventListener("click", () => { $("set-sheet").hidden = true; });
  // v70 (заказчик): настройки закрываются только кнопкой Close (касание мимо окна не закрывает).
  $("set-val").addEventListener("click", e => { const b = e.target.closest("[data-d]"); if (!b) return; st.val = Number(b.dataset.d); $("val-sheet").hidden = true; render(); renderSettings(); });
  $("set-max").addEventListener("click", e => { const b = e.target.closest("[data-d]"); if (!b) return; st.limit = Number(b.dataset.d); store.set("limit", st.limit); render(); renderSettings(); });
  // Тема запоминается на этом устройстве.
  const applyTheme = t => document.documentElement.classList.toggle("light", t === "light");
  applyTheme(store.get("theme", "dark"));
  $("set-theme").addEventListener("click", e => { const b = e.target.closest("[data-t]"); if (!b) return; store.set("theme", b.dataset.t); applyTheme(b.dataset.t); renderSettings(); });
  $("set-lang").addEventListener("click", e => { const b = e.target.closest("[data-l]"); if (!b) return; st.lang = b.dataset.l; store.set("lang", st.lang); render(); renderSettings(); });

  function showLogo() {
    let src = null; try { src = localStorage.getItem("cpt_logo"); } catch (e) {}
    ["logo", "lp"].forEach(p => {
      $(p + "-img").hidden = !src; $(p + "-txt").hidden = !!src;
      if (src) $(p + "-img").src = src; else $(p + "-img").removeAttribute("src");
    });
    $("b-logo-del").hidden = !src;
  }
  $("b-logo-del").addEventListener("click", () => { try { localStorage.removeItem("cpt_logo"); } catch (e) {} showLogo(); });
  $("in-logo").addEventListener("change", e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      const img = new Image();
      img.onload = () => {
        // Уменьшаем до 360×160, чтобы картинка влезла в память браузера.
        const k = Math.min(1, 360 / img.width, 160 / img.height);
        const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        try { localStorage.setItem("cpt_logo", c.toDataURL("image/png")); } catch (err) {}
        showLogo(); e.target.value = "";
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(f);
  });
  showLogo();

  reset();   // v69 (заказчик): при включении ничего не показываем — без примера, всё по нулям
  render();
})();
</script>

<script>
// Работа без интернета: после первого открытия страница берётся из памяти планшета.
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
